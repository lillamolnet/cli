name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # GoReleaser needs the earlier tags for the changelog.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
      - run: go vet ./...
      - run: go test -race ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The default token cannot write to another repository, so the cask
          # goes to lillamolnet/homebrew-tap with a token of its own.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
